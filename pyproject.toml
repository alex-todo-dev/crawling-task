[project]
name = "crawl-task"
version = "0.1.0"
description = "Web login page scanner"
requires-python = ">=3.12"
dependencies = [
    "motor>=3.7.1",
    "playwright>=1.59.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
